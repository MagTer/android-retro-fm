name: CI

# The unit tests on every PR and on main. release.yml builds bundles only, so until this
# existed a green suite was only as good as the last local run.
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # As in release.yml: the v3 default 'tools platform-tools' breaks, because Google
          # removed 'tools' from the repository.
          packages: platform-tools

      - name: Ensure API 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :core:testDebugUnitTest
