name: CI

# The unit tests on every PR and on main. release.yml builds bundles only, so until this
# existed a green suite was only as good as the last local run.
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # As in release.yml: the v3 default 'tools platform-tools' breaks, because Google
          # removed 'tools' from the repository.
          packages: platform-tools

      - name: Ensure API 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :core:testDebugUnitTest
